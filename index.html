<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>ذَكِّر</title>

<style>
*{box-sizing:border-box}
html,body{min-height:100%;background:#050b1d!important}
body{
  margin:0;
  position:relative;
  overflow-x:hidden;
  color:#f4f7f5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",sans-serif;
  background:#050b1d;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  background:
    radial-gradient(circle at 78% 16%,rgba(255,244,190,.16) 0 2px,transparent 3px),
    radial-gradient(circle at 18% 22%,rgba(160,190,255,.14) 0 1px,transparent 2px),
    linear-gradient(180deg,#06112d 0%,#08152e 52%,#050a1b 100%);
}
header{
  position:relative;
  z-index:3;
  padding:28px 18px 16px;
  text-align:center;
  position:sticky;
  top:0;
  background:rgba(5,11,29,.78);
  backdrop-filter:blur(12px);
  z-index:3;
  border-bottom:1px solid rgba(100,125,180,.25);
}
h1{margin:0;font-size:32px;color:#fff5c9}
p{color:#aab7b0}

.night-sky{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.night-moon{
  position:absolute;
  top:8vh;
  right:9vw;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#fff5c9;
  box-shadow:0 0 28px rgba(255,244,190,.18);
  animation:moonFloat 5s ease-in-out infinite,moonGlow 3.5s ease-in-out infinite;
}
@keyframes moonFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(8px) rotate(2deg)}
}
@keyframes moonGlow{
  0%,100%{box-shadow:0 0 24px rgba(255,244,190,.16)}
  50%{box-shadow:0 0 42px rgba(255,244,190,.32)}
}
.night-moon:after{
  content:"";
  position:absolute;
  top:-7px;
  right:-17px;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#07122d;
}
.night-stars{
  position:absolute;
  animation:starsDrift 18s linear infinite;
  inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.8px),
    radial-gradient(circle,rgba(190,205,255,.55) 0 1px,transparent 1.8px);
  background-size:137px 173px,211px 149px;
  background-position:18px 23px,77px 91px;
  opacity:.42;
}
.meteor{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  box-shadow:0 0 5px 1px rgba(255,255,255,.9);
}
.meteor:after{
  content:"";
  position:absolute;
  right:1px;
  top:0;
  width:80px;
  height:1px;
  transform:rotate(-32deg);
  transform-origin:right center;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75));
}
.m1{top:18%;right:-12%;animation:meteor1 7s linear infinite 1s}
.m2{top:34%;right:-18%;animation:meteor2 10s linear infinite 4s}
.m3{top:51%;right:-10%;animation:meteor1 8s linear infinite 6s}
@keyframes starsDrift{0%{transform:translate(0,0)}50%{transform:translate(-8px,5px)}100%{transform:translate(0,0)}}
@keyframes meteor1{
  0%,78%{opacity:0;transform:translate(0,0)}
  80%{opacity:.85}
  91%{opacity:.75;transform:translate(-55vw,32vh)}
  100%{opacity:0;transform:translate(-65vw,38vh)}
}
@keyframes meteor2{
  0%,80%{opacity:0;transform:translate(0,0)}
  82%{opacity:.65}
  93%{opacity:.55;transform:translate(-48vw,27vh)}
  100%{opacity:0;transform:translate(-57vw,32vh)}
}
@media (prefers-reduced-motion:reduce){
  .meteor{animation:none;display:none}
}

.tabs{
  position:relative;
  z-index:3;
  display:flex;
  gap:8px;
  padding:12px 14px;
  position:sticky;
  top:92px;
  background:rgba(5,11,29,.72);
  backdrop-filter:blur(10px);
  z-index:2;
}
.tab{
  flex:1;
  border:1px solid #304a70;
  background:#0a1325;
  color:#b9c8d8;
  border-radius:14px;
  padding:12px;
  font-size:17px;
}
.tab.active{
  background:#163b54;
  color:#fff;
  border-color:#fff5c9;
}
.progress{
  position:relative;
  z-index:3;
  margin:0 14px 12px;
  height:8px;
  background:#142033;
  border-radius:9px;
  overflow:hidden;
}
.bar{
  height:100%;
  background:#57d9a0;
  width:0;
}
.list{position:relative;z-index:2;padding:0 14px 40px}
.card{
  background:linear-gradient(145deg,rgba(15,28,55,.9),rgba(7,14,31,.92));
  border:1px solid rgba(100,125,180,.28);
  border-radius:18px;
  margin:12px 0;
  padding:17px;
  box-shadow:0 5px 20px #0008;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{
  width:34px;height:34px;
  border:1px solid #57d9a0;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#57d9a0;
  font-weight:700;
}
.count{
  color:#57d9a0;
  border:1px solid #276c48;
  border-radius:20px;
  padding:5px 10px;
  font-size:13px;
  white-space:nowrap;
}
.title{font-weight:700;color:#fff5c9;font-size:17px;flex:1}
.text{font-size:20px;line-height:2.05;margin:15px 0 12px;white-space:pre-wrap}
.ref{color:#8e9b94;font-size:12px;margin-bottom:10px}
.btn{
  width:100%;
  border:0;
  border-radius:13px;
  background:#163e3b;
  color:#fff;
  padding:13px;
  font-size:16px;
}
.btn.done{background:#2b7b50}
.empty{text-align:center;color:#8e9b94;padding:30px}
.small{font-size:13px;color:#7f8b85}

.theme-toggle{
  display:flex;
  gap:8px;
  margin:12px auto;
  max-width:720px;
  justify-content:center;
  position:relative;
  z-index:4;
}
.theme-toggle button{
  border:1px solid #57d9a0;
  background:#0d1729;
  color:#fff;
  border-radius:12px;
  padding:10px 18px;
}
</style>

<script>
function setTheme(mode){
  document.body.classList.toggle('evening',mode==='evening');
  localStorage.setItem('thakir-theme',mode);
}
function setupTheme(){
  const saved=localStorage.getItem('thakir-theme')||'evening';
  setTheme(saved);
}
window.addEventListener('DOMContentLoaded',setupTheme);
</script>

<style id="interactive-night-v3">
/* Keep the animated sky behind the app, but visible. */
.night-sky{z-index:0;transition:transform .25s ease-out}
header,.tabs,.progress,.list{position:relative}
header{z-index:4}.tabs{z-index:4}.progress{z-index:3}.list{z-index:2}

/* Moon animation */
.night-moon{
  animation:moonFloat 5s ease-in-out infinite,moonGlow 3.2s ease-in-out infinite;
  transition:transform .25s ease-out;
}
@keyframes moonFloat{
  0%,100%{transform:translate3d(0,0,0) rotate(0deg)}
  50%{transform:translate3d(0,8px,0) rotate(2deg)}
}
@keyframes moonGlow{
  0%,100%{box-shadow:0 0 24px rgba(255,244,190,.16)}
  50%{box-shadow:0 0 44px rgba(255,244,190,.34)}
}

/* Stars slowly drift */
.night-stars{animation:starsDrift 20s ease-in-out infinite}
@keyframes starsDrift{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(-8px,5px,0)}
}

/* Meteors: sudden appearance -> streak -> disappear */
.meteor{will-change:transform,opacity}
.m1{animation:meteor1 7s linear infinite 1s}
.m2{animation:meteor2 10s linear infinite 4s}
.m3{animation:meteor1 8s linear infinite 6s}
@keyframes meteor1{
  0%,74%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  76%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  89%{opacity:.85;transform:translate3d(-55vw,32vh,0) scale(1)}
  100%{opacity:0;transform:translate3d(-65vw,38vh,0) scale(.7)}
}
@keyframes meteor2{
  0%,77%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  79%{opacity:.95;transform:translate3d(0,0,0) scale(1)}
  92%{opacity:.7;transform:translate3d(-48vw,27vh,0) scale(1)}
  100%{opacity:0;transform:translate3d(-57vw,32vh,0) scale(.7)}
}

/* Tap feedback */
.btn,.tab,.counter-btn{
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;
}
.btn:active,.tab:active,.counter-btn:active{
  transform:scale(.96);
  filter:brightness(1.18);
}
.card{
  transform:translateZ(0);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card.pressed{
  transform:scale(.985);
  box-shadow:0 2px 12px #0009;
}
.card.completed{
  animation:completedPop .35s ease;
}
@keyframes completedPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.018)}
  100%{transform:scale(1)}
}

/* Small interactive glow following the user's finger. */
body{--mx:50%;--my:35%}
body::after{
  content:"";
  position:fixed;
  left:var(--mx);
  top:var(--my);
  width:180px;
  height:180px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
  z-index:1;
  background:radial-gradient(circle,rgba(87,217,160,.08),transparent 68%);
  transition:left .12s ease-out,top .12s ease-out;
}

/* Press burst */
.tap-burst{
  position:fixed;
  width:8px;height:8px;
  border-radius:50%;
  pointer-events:none;
  z-index:20;
  background:#57d9a0;
  box-shadow:0 0 12px rgba(87,217,160,.9);
  animation:tapBurst .55s ease-out forwards;
}
@keyframes tapBurst{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(9)}
}
@media (prefers-reduced-motion:reduce){
  .night-moon,.night-stars,.meteor,.card,body::after{animation:none;transition:none}
  .tap-burst{display:none}
}
</style>

<script id="interactive-night-v3-js">
(function(){
  const root=document.documentElement;
  const body=document.body;
  const sky=document.querySelector('.night-sky');
  const moon=document.querySelector('.night-moon');

  function move(x,y){
    const px=Math.max(0,Math.min(1,x/window.innerWidth));
    const py=Math.max(0,Math.min(1,y/window.innerHeight));
    body.style.setProperty('--mx',(px*100)+'%');
    body.style.setProperty('--my',(py*100)+'%');
    if(sky) sky.style.transform=`translate3d(${(px-.5)*-8}px,${(py-.5)*-5}px,0)`;
    if(moon) moon.style.marginRight=((px-.5)*-10)+'px';
  }

  window.addEventListener('pointermove',e=>move(e.clientX,e.clientY),{passive:true});

  function burst(x,y){
    const b=document.createElement('span');
    b.className='tap-burst';
    b.style.left=x+'px';
    b.style.top=y+'px';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),600);
  }

  window.addEventListener('pointerdown',e=>{
    burst(e.clientX,e.clientY);
  },{passive:true});

  // Gentle press animation for every dhikr card.
  document.addEventListener('pointerdown',e=>{
    const card=e.target.closest('.card');
    if(card) card.classList.add('pressed');
  },{passive:true});
  document.addEventListener('pointerup',()=>{
    document.querySelectorAll('.card.pressed').forEach(c=>c.classList.remove('pressed'));
  },{passive:true});
  document.addEventListener('pointercancel',()=>{
    document.querySelectorAll('.card.pressed').forEach(c=>c.classList.remove('pressed'));
  },{passive:true});

  // Small device-motion parallax when the browser provides orientation data.
  window.addEventListener('deviceorientation',e=>{
    if(e.gamma==null||e.beta==null)return;
    const x=Math.max(-1,Math.min(1,e.gamma/30));
    const y=Math.max(-1,Math.min(1,(e.beta-45)/30));
    if(sky) sky.style.transform=`translate3d(${x*-10}px,${y*-6}px,0)`;
    if(moon) moon.style.marginRight=(x*-14)+'px';
  },{passive:true});
})();
</script>
</head>

<body>
<div class="night-sky" aria-hidden="true">
  <div class="night-moon"></div>
  <div class="night-stars"></div>
  <i class="meteor m1"></i>
  <i class="meteor m2"></i>
  <i class="meteor m3"></i>
</div>

<header>
  <h1>ذكر</h1>
  <p>أذكار الصباح والمساء</p>
</header>

<div class="tabs">
  <button id="morning" class="tab active">أذكار الصباح</button>
  <button id="evening" class="tab">أذكار المساء</button>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>
<main class="list" id="list"></main>

<script src="data.js"></script>
<script>
let mode='morning';
const state=JSON.parse(localStorage.getItem('dhikrState')||'{}');
const list=document.getElementById('list');
const bar=document.getElementById('bar');

function key(){return mode==='morning'?'m':'e'}

function render(){
  const arr=DHIKR[mode],done=state[key()]||{};
  list.innerHTML='';
  arr.forEach((d,i)=>{
    const cur=done[i]||0;
    const complete=cur>=d.count;
    const c=document.createElement('article');
    c.className='card';
    c.innerHTML=`
      <div class="top">
        <span class="num">${i+1}</span>
        <div class="title">${d.title||'ذِكر'}</div>
        <span class="count">${d.count===1?'مرة واحدة':d.count+' مرات'}</span>
      </div>
      <div class="text">${d.text}</div>
      ${d.ref?`<div class="ref">${d.ref}</div>`:''}
      <button class="btn ${complete?'done':''}">
        ${complete?'✓ تم':'اضغط للتسبيح'} ${d.count>1&&!complete?`(${cur}/${d.count})`:''}
      </button>`;
    c.querySelector('.btn').onclick=()=>{
      done[i]=complete?0:cur+1;
      state[key()]=done;
      localStorage.setItem('dhikrState',JSON.stringify(state));
      render();
    };
    list.appendChild(c);
  });
  const n=arr.length;
  const p=Object.values(done).filter((v,i)=>v>=arr[i].count).length;
  bar.style.width=(p/n*100)+'%';
}

function setMode(m){
  mode=m;
  document.getElementById('morning').classList.toggle('active',m==='morning');
  document.getElementById('evening').classList.toggle('active',m==='evening');
  render();
}

document.getElementById('morning').onclick=()=>setMode('morning');
document.getElementById('evening').onclick=()=>setMode('evening');

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
