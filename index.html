<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>ذَكِّر</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050b1d}
body{
  color:#f4f7f5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",sans-serif;
  overflow-x:hidden;
  background:
    linear-gradient(180deg,#050a1b 0%,#07122a 48%,#050b1d 100%);
}

/* ===== Animated night background ===== */
.night-sky{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.night-sky::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 78% 18%,rgba(255,245,200,.09),transparent 18%),
    linear-gradient(180deg,rgba(4,10,27,.05),rgba(3,7,20,.28));
}
.night-stars{
  position:absolute;
  inset:-12px;
  opacity:.55;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.8px),
    radial-gradient(circle,rgba(160,190,255,.55) 0 1px,transparent 1.8px);
  background-size:137px 173px,211px 149px;
  background-position:18px 23px,77px 91px;
  animation:starsDrift 22s ease-in-out infinite;
}
@keyframes starsDrift{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(-9px,5px,0)}
}

.night-moon{
  position:absolute;
  top:86px;
  right:62px;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#fff4c2;
  box-shadow:0 0 28px rgba(255,244,194,.18);
  animation:moonFloat 5s ease-in-out infinite,moonGlow 3.5s ease-in-out infinite;
}
.night-moon::after{
  content:"";
  position:absolute;
  top:-7px;
  right:-17px;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#07122a;
}
@keyframes moonFloat{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  50%{transform:translate3d(-3px,8px,0) rotate(2deg)}
}
@keyframes moonGlow{
  0%,100%{box-shadow:0 0 24px rgba(255,244,194,.16)}
  50%{box-shadow:0 0 46px rgba(255,244,194,.32)}
}

/* Shooting stars: head moves down-left, tail stays behind upper-right. */
.meteor{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  box-shadow:0 0 8px 2px rgba(255,255,255,.95);
}
.meteor::after{
  content:"";
  position:absolute;
  left:1px;
  top:1px;
  width:95px;
  height:2px;
  border-radius:2px;
  transform:rotate(-32deg);
  transform-origin:left center;
  background:linear-gradient(90deg,rgba(255,255,255,.82),rgba(255,255,255,.12),transparent);
}
.m1{top:17%;right:-8%;animation:shoot1 8s linear infinite 1.5s}
.m2{top:32%;right:-14%;animation:shoot2 11s linear infinite 4.5s}
.m3{top:48%;right:-10%;animation:shoot1 9s linear infinite 7s}

@keyframes shoot1{
  0%,76%{opacity:0;transform:translate3d(0,0,0) scale(.65)}
  78%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  90%{opacity:.9;transform:translate3d(-55vw,32vh,0) scale(1)}
  100%{opacity:0;transform:translate3d(-68vw,40vh,0) scale(.7)}
}
@keyframes shoot2{
  0%,78%{opacity:0;transform:translate3d(0,0,0) scale(.65)}
  80%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  92%{opacity:.8;transform:translate3d(-48vw,27vh,0) scale(1)}
  100%{opacity:0;transform:translate3d(-60vw,34vh,0) scale(.7)}
}

/* ===== App layer ===== */
header{
  position:relative;
  z-index:3;
  padding:34px 18px 22px;
  text-align:center;
  background:linear-gradient(180deg,rgba(5,10,27,.74),rgba(5,10,27,.48));
  backdrop-filter:blur(3px);
  border-bottom:1px solid rgba(105,130,180,.22);
}
h1{
  margin:0;
  font-size:38px;
  color:#57d9a0;
  text-shadow:0 0 18px rgba(87,217,160,.12);
}
header p{color:#aab7c5;font-size:18px;margin:10px 0 0}

.tabs{
  position:relative;
  z-index:3;
  display:flex;
  gap:14px;
  padding:26px 14px 14px;
  background:rgba(5,10,27,.66);
  backdrop-filter:blur(7px);
}
.tab{
  flex:1;
  border:1px solid #2d527e;
  background:#081328;
  color:#b9c8d8;
  border-radius:26px;
  padding:18px 10px;
  font-size:20px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .14s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.tab.active{
  background:#173f59;
  color:#fff;
  border-color:#fff0bb;
  box-shadow:0 0 18px rgba(255,240,187,.08);
}
.tab:active{transform:scale(.97)}

.progress{
  position:relative;
  z-index:3;
  margin:10px 14px 16px;
  height:9px;
  background:#14233b;
  border-radius:99px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#57d9a0,#b6f0d2);
  border-radius:99px;
  transition:width .35s ease;
}

.list{
  position:relative;
  z-index:2;
  padding:0 14px 45px;
}
.card{
  background:linear-gradient(145deg,rgba(15,29,54,.94),rgba(7,14,30,.95));
  border:1px solid rgba(93,125,172,.3);
  border-radius:20px;
  margin:14px 0;
  padding:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.28);
  transition:transform .16s ease,box-shadow .2s ease,border-color .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.card.pressed{
  transform:scale(.985);
  box-shadow:0 3px 12px rgba(0,0,0,.35);
}
.card.completed{
  animation:donePop .38s ease;
  border-color:rgba(87,217,160,.6);
}
@keyframes donePop{
  0%{transform:scale(1)}
  50%{transform:scale(1.018)}
  100%{transform:scale(1)}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{
  width:36px;height:36px;border:1px solid #57d9a0;border-radius:50%;
  display:grid;place-items:center;color:#57d9a0;font-weight:700
}
.title{font-weight:700;color:#fff0bb;font-size:18px;flex:1}
.count{
  color:#57d9a0;border:1px solid #276c48;border-radius:20px;
  padding:6px 10px;font-size:13px;white-space:nowrap
}
.text{
  font-size:20px;line-height:2.05;margin:16px 0 12px;
  white-space:pre-wrap;cursor:pointer;
}
.ref{color:#8e9b94;font-size:12px;margin-bottom:10px}
.btn{
  width:100%;border:0;border-radius:14px;background:#163e3b;color:#fff;
  padding:14px;font-size:17px;cursor:pointer;
  transition:transform .12s ease,filter .12s ease,background .2s ease;
}
.btn:active{transform:scale(.97);filter:brightness(1.16)}
.btn.done{background:#2b7b50}

.tap-burst{
  position:fixed;
  width:9px;height:9px;border-radius:50%;
  pointer-events:none;z-index:20;background:#57d9a0;
  box-shadow:0 0 14px rgba(87,217,160,.95);
  animation:tapBurst .5s ease-out forwards;
}
@keyframes tapBurst{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(8)}
}

@media(max-width:600px){
  .night-moon{top:74px;right:42px;width:76px;height:76px}
  .night-moon::after{width:76px;height:76px}
}
@media(prefers-reduced-motion:reduce){
  .night-moon,.night-stars,.meteor{animation:none}
  .tap-burst{display:none}
}
</style>
</head>

<body>
<div class="night-sky" aria-hidden="true">
  <div class="night-stars"></div>
  <div class="night-moon"></div>
  <i class="meteor m1"></i>
  <i class="meteor m2"></i>
  <i class="meteor m3"></i>
</div>

<header>
  <h1>ذكر</h1>
  <p>أذكار الصباح والمساء</p>
</header>

<div class="tabs">
  <button id="morning" class="tab active">أذكار الصباح</button>
  <button id="evening" class="tab">أذكار المساء</button>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>
<main class="list" id="list"></main>

<script src="data.js"></script>
<script>
(function(){
  const TODAY=new Date().toISOString().slice(0,10);
  const savedDay=localStorage.getItem('thakir-day');
  if(savedDay!==TODAY){
    localStorage.removeItem('dhikrState');
    localStorage.setItem('thakir-day',TODAY);
  }

  let mode='morning';
  const state=JSON.parse(localStorage.getItem('dhikrState')||'{}');
  const list=document.getElementById('list');
  const bar=document.getElementById('bar');
  const morning=document.getElementById('morning');
  const evening=document.getElementById('evening');

  function key(){return mode==='morning'?'m':'e'}

  function save(){
    localStorage.setItem('dhikrState',JSON.stringify(state));
  }

  function updateProgress(arr,done){
    const total=arr.length;
    const completed=arr.reduce((n,d,i)=>n+((done[i]||0)>=d.count?1:0),0);
    bar.style.width=(total?(completed/total*100):0)+'%';
  }

  function advance(i,card,d){
    const done=state[key()]||(state[key()]={});
    let cur=done[i]||0;
    if(cur>=d.count){
      cur=0;
    }else{
      cur++;
    }
    done[i]=cur;
    save();

    const btn=card.querySelector('.btn');
    const counter=card.querySelector('.count');
    const complete=cur>=d.count;

    btn.textContent=complete?'✓ تم':`اضغط للتسبيح${d.count>1?` (${cur}/${d.count})`:''}`;
    btn.classList.toggle('done',complete);
    counter.textContent=complete?'تم':(d.count===1?'مرة واحدة':`${d.count} مرات`);

    card.classList.remove('completed');
    void card.offsetWidth;
    card.classList.add('completed');

    updateProgress(DHIKR[mode],done);
  }

  function render(){
    const arr=DHIKR[mode];
    const done=state[key()]||{};
    list.innerHTML='';

    arr.forEach((d,i)=>{
      const cur=done[i]||0;
      const complete=cur>=d.count;

      const card=document.createElement('article');
      card.className='card';
      card.innerHTML=`
        <div class="top">
          <span class="num">${i+1}</span>
          <div class="title">${d.title||'ذِكر'}</div>
          <span class="count">${complete?'تم':(d.count===1?'مرة واحدة':d.count+' مرات')}</span>
        </div>
        <div class="text">${d.text}</div>
        ${d.ref?`<div class="ref">${d.ref}</div>`:''}
        <button class="btn ${complete?'done':''}">${complete?'✓ تم':'اضغط للتسبيح'} ${d.count>1&&!complete?`(${cur}/${d.count})`:''}</button>
      `;

      const btn=card.querySelector('.btn');
      const text=card.querySelector('.text');

      btn.addEventListener('click',e=>{
        e.stopPropagation();
        advance(i,card,d);
      });

      // Tapping the dhikr text itself also counts.
      text.addEventListener('click',()=>{
        advance(i,card,d);
      });

      list.appendChild(card);
    });

    updateProgress(arr,done);
  }

  function setMode(m){
    mode=m;
    morning.classList.toggle('active',m==='morning');
    evening.classList.toggle('active',m==='evening');
    render();
  }

  morning.onclick=()=>setMode('morning');
  evening.onclick=()=>setMode('evening');

  // Press interaction on cards + tap burst.
  document.addEventListener('pointerdown',e=>{
    const card=e.target.closest('.card');
    if(card)card.classList.add('pressed');

    if(e.target.closest('.btn,.text,.tab')){
      const burst=document.createElement('span');
      burst.className='tap-burst';
      burst.style.left=e.clientX+'px';
      burst.style.top=e.clientY+'px';
      document.body.appendChild(burst);
      setTimeout(()=>burst.remove(),520);
    }
  },{passive:true});

  document.addEventListener('pointerup',()=>{
    document.querySelectorAll('.card.pressed').forEach(c=>c.classList.remove('pressed'));
  },{passive:true});

  document.addEventListener('pointercancel',()=>{
    document.querySelectorAll('.card.pressed').forEach(c=>c.classList.remove('pressed'));
  },{passive:true});

  // Subtle parallax from finger movement.
  const sky=document.querySelector('.night-sky');
  const moon=document.querySelector('.night-moon');
  window.addEventListener('pointermove',e=>{
    const x=(e.clientX/window.innerWidth-.5);
    const y=(e.clientY/window.innerHeight-.5);
    sky.style.transform=`translate3d(${x*-7}px,${y*-4}px,0)`;
    moon.style.marginRight=(x*-10)+'px';
  },{passive:true});

  render();

  // Keep the existing service-worker registration.
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
